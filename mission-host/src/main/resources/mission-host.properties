# 실행 호스트 설정. 파일 이름이 mission-host 인 것은 같은 JVM 의 registry·운영 서비스 설정과 가리지 않기 위해서다(S3a 스펙 §7.1).
spring.application.name=picasso-mission-host
spring.threads.virtual.enabled=true

# 값은 루트 .env 가 준다. 기본값을 적지 않는다: 빠지면 기동에서 멈춘다.
server.port=${HOST_PORT}
# 이 기계 밖에 열지 않는다. 호출자는 운영 서비스뿐이고 인증이 없다(S3a 스펙 §7.6, §12).
server.address=127.0.0.1
# mimic gRPC 는 같은 기계의 현장 프로세스가 연다(S3a 스펙 §6.2). 평문이다.
host.mimic.port=${MIMIC_GRPC_PORT}
# 셀 대역 GET /cell 의 루프백 주소(S3a 스펙 §6.3).
host.cell.url=http://127.0.0.1:${SITE_CELL_PORT}
# 현장 HTTP 면 인수 확인(POST /cell/controller/confirm, 플릿 포트가 있으면 /fleet/controller/confirm). 리스를 쥔 동안 호스트 잠금 밖 전용 스레드가
# 획득 직후 부르고, 이 세대로 확정(또는 현장이 대조 안 함을 답함)하기 전에는 retry 마다, 그 뒤에는 interval 마다 다시 부른다(실행 준비 조건 아님).
# retry 는 interval 이하여야 한다.
host.fence-confirm.interval=PT10S
host.fence-confirm.retry=PT1S
# 플릿 포트. 현장 플릿 세계 면(/fleet, 셀 대역과 같은 서버 http://127.0.0.1:<SITE_CELL_PORT>)의 주소다. 비우면 플릿 포트가 없고(AmrFleetPort.None)
# 플릿 운반 단위가 든 작업 지시·정의 활성화를 FLEET_PORT_ABSENT 로 받지 않는다. 스위치 값(mimic 등)은 없다 — 주소가 곧 선언이다.
# 실행 인자 --host.fleet.url=... 나 환경 변수 HOST_FLEET_URL 로 준다.
host.fleet.url=
# 임무 버전 저장(S3b 스펙 §6.1). 같은 Postgres 의 자기 스키마 mission 이다. 값은 루트 .env 가 준다.
spring.datasource.url=${PICASSO_DB_URL}
spring.datasource.username=${PICASSO_DB_USER}
spring.datasource.password=${PICASSO_DB_PASSWORD}
# 모의 실행(S3b 스펙 §6.4). 경로는 작업 디렉터리 기준이다. :mission-host:run 은 저장소 루트에서 돈다.
host.mock-run.profile=mission-host/mock-run/humanoid-a.json
host.mock-run.schema=picasso/profile/schema/capability-profile.schema.json
# 가상 시간 상한. 이 안에 정착하지 않으면 모의 실행은 실패(NOT_SETTLED)다. 실제 시간 상한 30초는 코드에 둔다(T10).
host.mock-run.virtual-limit=PT10M
# 현장 시간값 읽기 주기(S3c 스펙 §7.1). 실제 시간이다. 기동 안의 첫 읽기는 주기와 관계없이 한 번 동기로 한다.
host.site-timings.read-interval=PT1S
# 작업 허가 대응(ADR 52). 현장이 안전 신호마다 맡은 기체를 선언한 JSON 파일의 경로이고 작업 디렉터리 기준이다. 비우면 선언하지 않은 현장이며
# 미들웨어에 허가 포트를 붙이지 않는다(오늘의 발행 거동). 선언하면 대응에 없는 기체는 새 명령이 막히므로 기체를 빠짐없이 넣는다.
host.work-permit.mapping=
# 기체 퇴역(picasso §15.249). registry 의 토큰 없는 진단 읽기 GET /diag/robots?retired=true 를 주기마다 읽어 미들웨어에 비춘다. 퇴역한 기체로는
# 새 로봇 명령을 내지 않고 재할당 후보에서도 뺀다. 도는 단위는 끊지 않는다. 비우면 읽지 않고 포트를 붙이지 않는다(오늘의 발행 동작).
host.registry.url=http://127.0.0.1:${REGISTRY_PORT}
host.retirement.read-interval=PT2S
# 리스와 심장박동(HA 설계 기록 §4·§7, 능동-대기 1단계 기반). 실행 호스트는 mission.host_lease 를 쥔 하나만 복원·pump·발행하고 나머지는
# 대기(심장박동과 획득 시도만)다. period: 갱신·획득 시도·심장박동(mission.host_instance, 진단용) 주기. expiry: 갱신 한 번이 리스를 늘리는 폭
# (DB 시각, 주기의 세 배 이상). margin: 로컬 자기 차단 여유 — 갱신 요청을 보내기 직전 + expiry − margin 을 지나면 송신을 멈추고 리스를 잃은
# 것으로 다룬다(expiry − margin 은 주기의 두 배보다 길게). idle-in-transaction-timeout: 쓰기 트랜잭션의 유휴 제한(expiry 보다 짧게) —
# 리스 행을 쥔 채 멎은 세션을 DB 가 끊는다. 만료 30초는 30초 인수가 아니다(만료 + 획득 주기 + 재대조, 만료 인수는 운영자 확인까지 관측만).
host.lease.period=PT5S
host.lease.expiry=PT30S
host.lease.margin=PT5S
host.lease.idle-in-transaction-timeout=PT10S
# 공용 풀 연결의 세션 statement_timeout(expiry 보다 짧게, pump 의 가장 긴 문장보다 넉넉히). 유휴 트랜잭션 제한과 함께 연결을 열 때 건다.
host.lease.statement-timeout=PT25S
# 만료 인수 뒤 관측(HOLDING) 중 미리 읽은 값이 없는 미준비 기체를 첫 관측 뒤 다시 호스트 잠금 아래에서 동기로 읽는 기체별 간격(단조 시계).
# 답하지 않는 기체 하나가 스냅숏 기한(10초)만큼 잠금을 쥐는 일을 이 간격에 한 번으로 묶고, 회복한 수신자의 기체가 열릴 길을 남긴다.
host.readiness.unread-retry=PT10S
# 정착한 실행을 picasso 메모리에서 놓는다(Middleware.forget). PHYSICALLY_DONE·ABORTED는 정착을 적고 곧 놓는다. FAILED·UNVERIFIED는
# 같은 작업 지시 ID의 상위 버전을 받을 수 있게 이 보존 시간(기본 5분, 호스트 시계) 동안 두었다가 놓는다. 놓은 작업 지시는 다시 받지 않는다(새 작업 지시 ID로 낸다).
host.settled.revisable-retention=PT5M
# 인시던트 고리(picasso H1 host-kit, 한계 §15.176). 개념 증명이다. 셋 다 비우면 붙지 않는다(오늘의 동작).
# entitlements: 자동 승인 자격 선언 JSON 파일(picasso FileEntitlements 형식). 경로는 작업 디렉터리 기준이고 못 읽으면 기동이 멈춘다.
# approval-port: 승인 호스트 POST /approvals 의 포트. 루프백에만 붙고 신원을 인증하지 않는다(picasso §15.3). 열려면 entitlements 가 있어야 한다.
# export: 인시던트 대장·조치 탐색 대장·안내·작업 응답을 pump 마다 쓰는 디렉터리. incident-recovery·incident-narrator 가 읽는다.
# 견본은 mission-host/incident-loop/entitlements.example.json을 복사해 사용하며 picasso의 시연 픽스처는 쓰지 않는다.
host.incident-loop.entitlements=
host.incident-loop.approval-port=
host.incident-loop.export=
