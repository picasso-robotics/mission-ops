# 운영 서비스 설정. 파일 이름이 ops-service 인 것은 registry 의 application.properties 와 가리지 않기 위해서다(스펙 §7.1).
spring.application.name=picasso-ops-service
spring.threads.virtual.enabled=true

# 값은 루트 .env 가 준다(스펙 §4). 기본값을 적지 않는다: 빠지면 기동에서 멈춘다.
server.port=${OPS_PORT}
# 이 기계 밖에 열지 않는다. 화면은 Vite 프록시로 붙는다.
server.address=127.0.0.1
spring.datasource.url=${PICASSO_DB_URL}
spring.datasource.username=${PICASSO_DB_USER}
spring.datasource.password=${PICASSO_DB_PASSWORD}
ops.site-id=${SITE_ID}
ops.registry.url=http://127.0.0.1:${REGISTRY_PORT}
ops.registry.operator-token=${PICASSO_OPERATOR_TOKEN}
# 실행 호스트(S3a 스펙 §8). 운영 서비스는 picasso 를 쓰지 않고 호스트 REST 만 부른다. 루프백이고 토큰이 없다.
ops.host.url=http://127.0.0.1:${HOST_PORT}
# 작업 지시 철회(B3)의 요청 제한. 대체 접수가 원 요청 행 잠금을 쥔 채 기다리므로 일반 요청 제한(5초)보다 짧다.
ops.host.withdraw-timeout=PT3S

# Mock MES PoC identity. Empty token disables integration endpoints.
ops.integration.token=${PICASSO_INTEGRATION_TOKEN:}
ops.integration.source=${PICASSO_INTEGRATION_SOURCE:mock-mes}

# Local Mock MES callback only; blank disables delivery. Transport success is separate from result ACK.
ops.integration.callback-url=${PICASSO_LOCAL_CALLBACK_URL:}
ops.integration.callback-token=${PICASSO_LOCAL_CALLBACK_TOKEN:}
ops.results.poll-ms=5000
# RECEIVED/DISPATCHING left by a stopped process close after this many seconds.
ops.requests.stale-seconds=300
ops.results.delivery-ms=2000
spring.task.scheduling.pool.size=2
# Instance heartbeat (HA design record §8 stage 0). Each period the process refreshes its ops.service_instance row on the database clock.
# Expiry is how long after the last beat other instances read this one as stopped; at least three periods. A clean shutdown records the stop.
# A station run left RETRYING/REWORKING by another instance is taken for review only once that instance stopped or expired.
ops.instance.heartbeat-period=PT5S
ops.instance.heartbeat-expiry=PT30S
